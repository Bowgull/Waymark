# Layer 1 e2e: Playwright, WebKit with an iPhone 15 profile, against a scratch
# wrangler dev + local D1 (tests/e2e/global-setup.ts). No secrets: the test
# backend has an empty Anthropic key and a public dummy API key.
#
# Screenshot baselines are per platform (tests/e2e/__screenshots__/<platform>/)
# and CI compares against the committed ones: a missing or changed screenshot
# fails the run. Baselines are only written in two cases, never silently:
#   - no tests/e2e/__screenshots__/linux/ at all (the very first run): it
#     records them with --update-snapshots=missing and uploads them in the
#     artifact; commit them from there into tests/e2e/__screenshots__/linux/.
#   - a manual run (workflow_dispatch) with update_snapshots ticked, to
#     re-record after an intended visual change; commit them the same way.
name: e2e (Playwright WebKit)

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Re-record the linux screenshot baselines (commit them from the artifact)
        type: boolean
        default: false
  push:
    branches: [codex/roadtrip-coach]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's own image: WebKit and its system libraries come installed, so a
    # slow Ubuntu mirror can't eat the run (it took 11-15 of the 30 min on 2026-10-23).
    # Keep the tag in step with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Playwright
        env:
          CI: '1'
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots && 'yes' || 'no' }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = yes ]; then
            echo "::warning::Re-recording the linux baselines (manual run): commit them from the artifact."
            npx playwright test --update-snapshots=changed
          elif [ -d tests/e2e/__screenshots__/linux ]; then
            npx playwright test --update-snapshots=none
          else
            echo "::warning::No linux baselines yet: recording them (see the artifact) and committing nothing."
            npx playwright test --update-snapshots=missing
          fi

      - name: Upload report and screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            playwright-report/
            test-results/
            tests/e2e/__screenshots__/
          retention-days: 3
