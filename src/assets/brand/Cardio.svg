<!-- DIAMOND 3 — large, bottom, deep teal -->
<path filter="url(#fss)" fill="#010402" d="M110,152 L142,194 L110,214 L78,194 Z"/>
<path fill="url(#gg)"  d="M110,154 L140,194 L110,212 L80,194 Z"/>
