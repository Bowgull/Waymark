<path fill="none" stroke="url(#gg)" stroke-width="2" stroke-linejoin="miter" opacity="0.7"
  d="M110,30 L124,52 L110,62 L96,52 Z"/>

<!-- DIAMOND 2 — medium, mid, teal -->
<path filter="url(#fss)" fill="#010402" d="M110,86 L132,118 L110,134 L88,118 Z"/>
