<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
<defs>
  <radialGradient id="gg" cx="32%" cy="24%" r="74%">
    <stop offset="0%"   stop-color="#EAC860"/>
    <stop offset="38%"  stop-color="#C8A030"/>
    <stop offset="78%"  stop-color="#7A5C18"/>
    <stop offset="100%" stop-color="#3A2A08"/>
  </radialGradient>
  <radialGradient id="gt" cx="36%" cy="28%" r="68%">
    <stop offset="0%"   stop-color="#5AC8AA"/>
    <stop offset="45%"  stop-color="#2A8A6C"/>
    <stop offset="85%"  stop-color="#0A3828"/>
    <stop offset="100%" stop-color="#030E0A"/>
  </radialGradient>
  <radialGradient id="gc" cx="36%" cy="28%" r="68%">
    <stop offset="0%"   stop-color="#CC5838"/>
    <stop offset="50%"  stop-color="#8C2E18"/>
    <stop offset="100%" stop-color="#3A1008"/>
  </radialGradient>
  <radialGradient id="gt2" cx="36%" cy="28%" r="68%">
    <stop offset="0%"   stop-color="#4ABCAA"/>
    <stop offset="55%"  stop-color="#1A6A52"/>
    <stop offset="100%" stop-color="#030E0A"/>
  </radialGradient>
  <filter id="fs">
    <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.88"/>
  </filter>
  <filter id="fss">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.75"/>
  </filter>
</defs>

<!-- BASE ANCHOR -->
<path fill="#010402" d="M88,242 L110,256 L132,242 L126,232 L110,244 L94,232 Z"/>
<path fill="url(#gg)" d="M90,241 L110,254 L130,241 L124,232 L110,243 L96,232 Z"/>
<path fill="#020806" d="M96,238 L110,248 L124,238 L120,232 L110,241 L100,232 Z"/>

<!-- CENTRAL SPINE -->
<path fill="#010402" d="M106,36 L114,36 L112,236 L108,236 Z"/>
