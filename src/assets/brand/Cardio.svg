<path fill="#020806"   d="M108.5,38 L111.5,38 L110.8,234 L109.2,234 Z"/>
<path fill="url(#gt)"  opacity="0.55" d="M109,39 L111,39 L110.6,233 L109.4,233 Z"/>

<!-- DIAMOND 1 — small, top, clay accent -->
