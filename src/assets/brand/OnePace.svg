<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
<defs>
  <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#EAC860"/>
    <stop offset="50%"  stop-color="#C8A030"/>
    <stop offset="100%" stop-color="#7A5C18"/>
  </linearGradient>
  <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#EAC860"/>
    <stop offset="100%" stop-color="#A07830"/>
  </linearGradient>
  <radialGradient id="sg" cx="45%" cy="38%" r="65%">
    <stop offset="0%"   stop-color="#2A3A28"/>
    <stop offset="60%"  stop-color="#111C10"/>
    <stop offset="100%" stop-color="#060C06"/>
  </radialGradient>
  <radialGradient id="eg" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#5AC8AA"/>
    <stop offset="60%"  stop-color="#1D9E75"/>
    <stop offset="100%" stop-color="#0A3828"/>
  </radialGradient>
  <filter id="fs">
    <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.88"/>
  </filter>
  <filter id="fss">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.75"/>
  </filter>
</defs>

