<circle cx="174" cy="62" r="8.5" fill="none" stroke="#010402" stroke-width="2.5"/>
<circle cx="174" cy="62" r="8.5" fill="none" stroke="url(#gg)" stroke-width="1.2" opacity="0.7"/>

<!-- Knob BL (46,154) -->
<circle cx="46" cy="154" r="10" fill="#010402"/>
<circle cx="46" cy="154" r="8.5" fill="url(#gg)"/>
<circle cx="46" cy="154" r="5.5" fill="#010402"/>
<circle cx="46" cy="154" r="4"   fill="#1D9E75"/>
<circle cx="46" cy="154" r="2"   fill="#5AC8AA"/>
<circle cx="46" cy="154" r="8.5" fill="none" stroke="#010402" stroke-width="2.5"/>
<circle cx="46" cy="154" r="8.5" fill="none" stroke="url(#gg)" stroke-width="1.2" opacity="0.7"/>

<!-- Knob BR (174,154) -->
<circle cx="174" cy="154" r="10" fill="#010402"/>
<circle cx="174" cy="154" r="8.5" fill="url(#gg)"/>
<circle cx="174" cy="154" r="5.5" fill="#010402"/>
