<circle cx="174" cy="154" r="2"   fill="#5AC8AA"/>
<circle cx="174" cy="154" r="8.5" fill="none" stroke="#010402" stroke-width="2.5"/>
<circle cx="174" cy="154" r="8.5" fill="none" stroke="url(#gg)" stroke-width="1.2" opacity="0.7"/>

<!-- ═══ LAYER 2: STRAW HAT ════════════════════════════════════
     Brim center: 110,72 — clearly above skull top
-->
<!-- Brim shadow -->
<ellipse cx="110" cy="74" rx="38" ry="6" fill="#000" opacity="0.5"/>
