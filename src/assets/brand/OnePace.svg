<ellipse cx="110" cy="70" rx="22" ry="1.5" fill="#1D6A50" opacity="0.7"/>
<!-- Crown dome -->
<path fill="#0A2818" d="M94,72 Q98,56 110,52 Q122,56 126,72"/>
<path fill="#0F3520" d="M96,72 Q100,58 110,54 Q120,58 124,72"/>
