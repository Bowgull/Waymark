appId: com.joshbocas.app
name: Run-walk - the warm-up, then run and walk intervals
# sim-api.sh before this flow: a good morning and an ad-hoc Run-Walk today.
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
- tapOn: ".*RUN-WALK.*"
- runFlow: shared/today-bottom.yaml
- tapOn: "ENTER"
- extendedWaitUntil:
    visible: "1 OF 6"
    timeout: 20000
- takeScreenshot: 05-run-walk-warmup
# Six warm-up moves: START a timed one then swipe the grass up to skip it; DONE a rep one.
- repeat:
    while:
      notVisible: "START RUN"
    times: 20
    commands:
      - tapOn:
          text: "START"
          optional: true
      - tapOn:
          text: "DONE"
          optional: true
      - swipe:
          start: 50%, 92%
          end: 50%, 45%
          duration: 600
          optional: true
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: 05-run-walk-ready
- tapOn: "INDOOR"
- tapOn: "START RUN"
# Indoors, START RUN opens One Pace in Safari (by design: the treadmill show);
# the run keeps time in the app and its Live Activity, in the Dynamic Island.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 05-run-walk-start-one-pace
# Back to Waymark, the run going.
- launchApp:
    stopApp: false
- takeScreenshot: 05-run-walk-start
- extendedWaitUntil:
    visible: "RUN 1/.*"
    timeout: 200000
- takeScreenshot: 05-run-walk-run
- extendedWaitUntil:
    visible: "WALK 1/.*"
    timeout: 300000
- takeScreenshot: 05-run-walk-walk
