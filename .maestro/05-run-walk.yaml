appId: com.joshbocas.app
name: Run-walk - the warm-up, then run and walk intervals
# sim-api.sh before this flow: a good morning and an ad-hoc Run-Walk today.
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
- runFlow:
    file: shared/row-in-view.yaml
    env:
      ROW: ".*RUN-WALK.*"
- tapOn: ".*RUN-WALK.*"
- runFlow: shared/today-bottom.yaml
- runFlow:
    file: shared/enter-session.yaml
    env:
      READY: "1 OF 6"
- takeScreenshot: 05-run-walk-warmup
# Six warm-up moves: tap the grass to start a timed one, then swipe it up to
# skip it; DONE a rep one.
- repeat:
    while:
      notVisible: "START RUN"
    times: 20
    commands:
      - tapOn:
          text: "Timer\\. Tap to start\\..*"
          optional: true
      - tapOn:
          text: "DONE"
          optional: true
      - swipe:
          start: 50%, 92%
          end: 50%, 45%
          duration: 600
          optional: true
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: 05-run-walk-ready
- tapOn: "INDOOR"
- tapOn: "START RUN"
# Indoors, START RUN opens One Pace in Safari (by design: the treadmill show);
# the run keeps time in the app and its Live Activity, in the Dynamic Island.
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 05-run-walk-start-one-pace
# Back to Waymark, the run going.
- launchApp:
    stopApp: false
- takeScreenshot: 05-run-walk-start
# Poll in short waits (a long wait gave up early on the runner: REST after
# 1.5 s of 30, WALK after 103 s of 300; and waitForAnimationToEnd on these
# moving screens took 18 s a turn, missing FINISH's 10 s). Up to about 200 s, as before.
- repeat:
    while:
      notVisible: "Round 1 of .*"
    times: 100
    commands:
      - extendedWaitUntil:
          visible: "Round 1 of .*"
          timeout: 2000
          optional: true
- assertVisible: "Round 1 of .*"
- takeScreenshot: 05-run-walk-run
- repeat:
    while:
      notVisible: "Next 2 of .*"
    times: 150
    commands:
      - extendedWaitUntil:
          visible: "Next 2 of .*"
          timeout: 2000
          optional: true
- assertVisible: "Next 2 of .*"
- takeScreenshot: 05-run-walk-walk
