# Page 98 (Josh 2026-10-30): Today loads with nothing open. A double tap on a
# to-do row puts ENTER on the row and its lines never open; a tap outside puts
# it away. A real iOS double tap, which the browser tests can only imitate.
# sim-api.sh before this flow: a Reset added to today.
appId: com.joshbocas.app
name: Today - double tap a row for ENTER
---
- launchApp:
    stopApp: true
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
- assertNotVisible: "ENTER"
- doubleTapOn: "(?i)reset reset.*"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "ENTER"
# the lines stayed shut: the Reset's own rows never showed
- assertNotVisible: "Reading the plan.*"
- takeScreenshot: 09-double-tap-enter
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "ENTER"
