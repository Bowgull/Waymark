appId: com.joshbocas.app
name: Bag round - work, last 10 s, rest (and the Live Activity)
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
- tapOn: "Bag Work BAG WORK.*"
- runFlow: shared/today-bottom.yaml
- runFlow:
    file: shared/enter-session.yaml
    env:
      READY: "START ROUND"
- takeScreenshot: 04-bag-ready
- tapOn: "START ROUND"
- assertVisible: "FIGHT"
- takeScreenshot: 04-bag-work
# The round on screen: its last 10 s (FINISH), then the rest (REST).
# Poll in short waits (a long wait gave up early on the runner: REST after
# 1.5 s of 30, WALK after 103 s of 300; and waitForAnimationToEnd on these
# moving screens took 18 s a turn, missing FINISH's 10 s). Up to about 240 s, as before.
- repeat:
    while:
      notVisible: "FINISH"
    times: 120
    commands:
      - extendedWaitUntil:
          visible: "FINISH"
          timeout: 2000
          optional: true
- assertVisible: "FINISH"
- takeScreenshot: 04-bag-last-10s
- repeat:
    while:
      notVisible: "REST"
    times: 30
    commands:
      - extendedWaitUntil:
          visible: "REST"
          timeout: 2000
          optional: true
- assertVisible: "REST"
- takeScreenshot: 04-bag-rest
# The rest runs out, round 2 waits for START ROUND.
- repeat:
    while:
      notVisible: "START ROUND"
    times: 60
    commands:
      - extendedWaitUntil:
          visible: "START ROUND"
          timeout: 2000
          optional: true
- assertVisible: "START ROUND"
- tapOn: "START ROUND"
- assertVisible: "FIGHT"
# The Live Activity while round 2 runs: the app backgrounded (Dynamic Island),
# then the lock screen. (Done after the rest: on a slow runner these steps
# took 3 min, and round 1 ran out in the background.) The workflow tries the
# Simulator's lock again after this flow.
- pressKey:
    key: Home
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-bag-live-activity-home
- pressKey:
    key: Lock
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-bag-live-activity-lock
# iOS asks once whether Waymark may show Live Activities: allow, and shoot again.
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 04-bag-live-activity-lock-allowed
- pressKey:
    key: Home
    optional: true
- swipe:
    direction: UP
    optional: true
- launchApp:
    stopApp: false
# Back in the round (whichever phase it has reached by now).
- extendedWaitUntil:
    visible: "FIGHT|FINISH|REST|START ROUND"
    timeout: 60000
- takeScreenshot: 04-bag-back
