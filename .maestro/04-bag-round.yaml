appId: com.joshbocas.app
name: Bag round - work, last 10 s, rest (and the Live Activity)
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
- tapOn: "Bag Work BAG WORK.*"
- runFlow: shared/today-bottom.yaml
- tapOn: "ENTER"
- extendedWaitUntil:
    visible: "START ROUND"
    timeout: 20000
- takeScreenshot: 04-bag-ready
- tapOn: "START ROUND"
- assertVisible: "FIGHT"
- takeScreenshot: 04-bag-work
# The Live Activity: the app backgrounded (Dynamic Island), then the lock screen.
# Both are best effort: the workflow also tries Simulator's Device > Lock.
- pressKey:
    key: Home
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-bag-live-activity-home
- pressKey:
    key: Lock
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-bag-live-activity-lock
# iOS asks once whether Waymark may show Live Activities: allow, and shoot again.
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 04-bag-live-activity-lock-allowed
- pressKey:
    key: Home
    optional: true
- swipe:
    direction: UP
    optional: true
- launchApp:
    stopApp: false
# The round runs on: its last 10 s, then the rest.
- extendedWaitUntil:
    visible: "FINISH"
    timeout: 240000
- takeScreenshot: 04-bag-last-10s
# (A plain wait for REST gave up after 1.5 s in run 39334853303: poll instead.)
- repeat:
    while:
      notVisible: "REST"
    times: 30
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible: "REST"
- takeScreenshot: 04-bag-rest
