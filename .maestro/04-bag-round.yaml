appId: com.joshbocas.app
name: Bag round - work, last 10 s, rest (and the Live Activity)
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
- tapOn: "(?i)bag work bag work.*"
- runFlow: shared/today-bottom.yaml
- runFlow:
    file: shared/enter-session.yaml
    env:
      # the preview card (BEGIN), then the 5:00 skip-rope warm-up, then round 1
      READY: "BEGIN|START BAG WORK|Timer\\. Tap to (start|pause).*|Round 1 of .*"
# Through the preview and the warm-up to round 1: BEGIN, start the rope's grass, swipe it on.
- repeat:
    while:
      notVisible: "Round 1 of .*"
    times: 12
    commands:
      - tapOn:
          text: "BEGIN|START BAG WORK"
          optional: true
      - tapOn:
          text: "Timer\\. Tap to start\\..*"
          optional: true
      - swipe:
          start: 50%, 92%
          end: 50%, 45%
          duration: 600
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- takeScreenshot: 04-bag-ready
# page 71: the grass starts the round (no START ROUND button)
- tapOn: "Timer\\. Tap to start\\..*"
- assertVisible: "FIGHT"
- takeScreenshot: 04-bag-work
- repeat:
    while:
      notVisible: "FINISH"
    times: 120
    commands:
      - extendedWaitUntil:
          visible: "FINISH"
          timeout: 2000
          optional: true
- assertVisible: "FINISH"
- takeScreenshot: 04-bag-last-10s
- repeat:
    while:
      notVisible: "REST"
    times: 30
    commands:
      - extendedWaitUntil:
          visible: "REST"
          timeout: 2000
          optional: true
- assertVisible: "REST"
- takeScreenshot: 04-bag-rest
# The rest runs out; round 2 waits on its grass.
# the rest ends; round 2 waits on its grass
- repeat:
    while:
      notVisible: "Timer\\. Tap to start\\..*"
    times: 60
    commands:
      - extendedWaitUntil:
          visible: "Timer\\. Tap to start\\..*"
          timeout: 2000
          optional: true
- tapOn: "Timer\\. Tap to start\\..*"
- assertVisible: "FIGHT"
# The Live Activity while round 2 runs: the app backgrounded (Dynamic Island),
# then the lock screen. (Done after the rest: on a slow runner these steps
# took 3 min, and round 1 ran out in the background.) The workflow tries the
# Simulator's lock again after this flow.
- pressKey:
    key: Home
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-bag-live-activity-home
- pressKey:
    key: Lock
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-bag-live-activity-lock
# iOS asks once whether Waymark may show Live Activities: allow, and shoot again.
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: 04-bag-live-activity-lock-allowed
- pressKey:
    key: Home
    optional: true
- swipe:
    direction: UP
    optional: true
- launchApp:
    stopApp: false
# Back in the round (whichever phase it has reached by now).
- extendedWaitUntil:
    visible: "FIGHT|FINISH|REST|Timer.*"
    timeout: 60000
- takeScreenshot: 04-bag-back
