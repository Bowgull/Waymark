# The coach model on a real iPhone (the Playwright spec 09-coach covers the full swap):
# a long press on a row opens REPLACE / SKIP (page 73), + add session opens the coach's
# picks, and Program's week log opens. Nothing is changed: each window is closed.
appId: com.joshbocas.app
name: The coach model - the hold window, + Add, the week log
---
- launchApp:
    stopApp: true
- runFlow: shared/open-today.yaml
- scrollUntilVisible:
    element: "(?i)foundation foundation ~.*"
    direction: DOWN
    timeout: 20000
- longPressOn: "(?i)foundation foundation ~.*"
- extendedWaitUntil:
    visible: "Replace"
    timeout: 10000
- assertVisible: "Skip"
- takeScreenshot: 07-coach-hold-window
# a tap outside closes it (the veil covers the screen; the very top is the status bar)
- tapOn:
    point: 50%, 20%
- extendedWaitUntil:
    notVisible: "Replace"
    timeout: 5000
- runFlow: shared/today-bottom.yaml
# A tap while the page still glides from the scroll only stops the glide (iOS),
# so tap until the picks open.
- repeat:
    while:
      notVisible: "Everything else"
    times: 5
    commands:
      - tapOn: "\\+ add session"
      - extendedWaitUntil:
          visible: "Everything else"
          timeout: 4000
          optional: true
- assertVisible: "Everything else"
- takeScreenshot: 07-coach-add
- tapOn:
    point: 50%, 20%
- tapOn: "program"
- tapOn:
    text: ".* changes? ›"
    optional: true
- takeScreenshot: 07-coach-week-log
