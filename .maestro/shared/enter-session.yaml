appId: com.joshbocas.app
name: ENTER the open row's session (again if the start didn't take)
# env READY: what the session screen shows once it's open.
# ENTER starts the session on the Worker first; on the runner an answer can
# take 10 s, past the app's timeout, and Today stays put (the server may have
# started it anyway: the row then reads RESUME). Tap again, up to 3 times.
---
# The open row's ENTER ends its lines; centred, so the live strip (another
# session still running) can't sit over it and take the tap.
- scrollUntilVisible:
    element: "ENTER|RESUME"
    direction: DOWN
    centerElement: true
    timeout: 10000
    optional: true
- repeat:
    while:
      notVisible: ${READY}
    times: 3
    commands:
      - tapOn:
          text: "ENTER.*|RESUME.*"
          optional: true
      - extendedWaitUntil:
          visible: ${READY}
          timeout: 20000
          optional: true
- assertVisible: ${READY}
