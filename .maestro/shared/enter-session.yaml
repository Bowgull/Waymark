appId: com.joshbocas.app
name: ENTER the open row's session (again if the start didn't take)
# env READY: what the session screen shows once it's open.
# ENTER starts the session on the Worker first; on the runner an answer can
# take 10 s, past the app's timeout, and Today stays put (the server may have
# started it anyway: the row then reads RESUME). Tap again, up to 3 times.
---
# Page 98: a tapped row's lines open a quarter second after the tap, and end
# with ENTER. Wait for it, then scroll to the bottom again: the open lines made
# Today taller, and ENTER left low can sit under the live strip (another
# session still running), which then takes the tap.
- extendedWaitUntil:
    visible: "ENTER|RESUME"
    timeout: 10000
    optional: true
- swipe:
    start: 50%, 75%
    end: 50%, 30%
    duration: 500
- swipe:
    start: 50%, 75%
    end: 50%, 30%
    duration: 500
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
    timeout: 20000
- repeat:
    while:
      notVisible: ${READY}
    times: 3
    commands:
      - tapOn:
          text: "ENTER.*|RESUME.*"
          optional: true
      - extendedWaitUntil:
          visible: ${READY}
          timeout: 20000
          optional: true
- assertVisible: ${READY}
