appId: com.joshbocas.app
name: Today, loaded (RELOAD if it didn't)
# The runner's test Worker is sometimes slower than the app's 10 s timeout
# (no GPU, a busy Simulator), and Today then shows TODAY DIDN'T LOAD with
# RELOAD, as designed. Press it, up to twice, until the week strip is there.
# The week strip is its own read, after the day's: on the runner it can pass
# the app's 10 s timeout while the rest of Today loads (the other tabs' first
# reads now go out alongside it), and Today then shows its boards with no
# strip and no RELOAD. Open the app again, once.
---
- tapOn:
    text: "Don.t Allow"
    optional: true
- extendedWaitUntil:
    visible: "Morning Report.*|RELOAD"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible: "Morning Report.*|RELOAD"
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Morning Report.*|RELOAD"
          timeout: 60000
- runFlow:
    when:
      visible: "RELOAD"
    commands:
      - tapOn: "RELOAD"
      - extendedWaitUntil:
          visible: "Morning Report.*|RELOAD"
          timeout: 60000
- runFlow:
    when:
      visible: "RELOAD"
    commands:
      - tapOn: "RELOAD"
      - extendedWaitUntil:
          visible: "Morning Report.*|RELOAD"
          timeout: 60000
# The weather asks for location (a WebKit prompt): the private answer; Today works without it.
- tapOn:
    text: "Don.t Allow"
    optional: true
- assertVisible: "Morning Report.*"
