appId: com.joshbocas.app
name: Today - Morning Report, no Coach board
---
- launchApp:
    stopApp: true
    permissions:
      notifications: allow
- tapOn:
    text: "Allow"
    optional: true
- runFlow: shared/open-today.yaml
- extendedWaitUntil:
    visible: "\\+ add session"
    timeout: 60000
- takeScreenshot: 01-today
- assertVisible: "Morning Report, logged.*"
- assertNotVisible: "COACH"
- scrollUntilVisible:
    element: "\\+ add session"
    direction: DOWN
    optional: true
- takeScreenshot: 01-today-board
