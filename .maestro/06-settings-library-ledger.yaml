appId: com.joshbocas.app
name: Settings, the Library, the Ledger
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
# Settings is the line under the board, below the fold once the day is full.
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
- tapOn: "Settings"
- assertVisible: "MT class days"
- takeScreenshot: 06-settings
- scroll
- takeScreenshot: 06-settings-2
- tapOn: "‹ TODAY"
# a tab tap can land mid-transition: tap until the Library shows
- repeat:
    while:
      notVisible: "techniques"
    times: 4
    commands:
      - tapOn: "library"
      - extendedWaitUntil:
          visible: "techniques"
          timeout: 5000
          optional: true
- assertVisible: "techniques"
- takeScreenshot: 06-library
- tapOn: "strength"
- takeScreenshot: 06-library-strength
- tapOn: "Back to the Library"
- repeat:
    while:
      notVisible: "WEEK"
    times: 4
    commands:
      - tapOn: "ledger"
      - extendedWaitUntil:
          visible: "WEEK"
          timeout: 5000
          optional: true
- assertVisible: "WEEK"
- takeScreenshot: 06-ledger-week
- tapOn: "MONTH"
- takeScreenshot: 06-ledger-month
- tapOn: "SEASON"
- takeScreenshot: 06-ledger-season
