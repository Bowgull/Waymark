appId: com.joshbocas.app
name: Settings, the Library, the Ledger
---
- launchApp:
    stopApp: true
# Today has loaded (the week strip sits at the top; the board below it grows
# as the flows add sessions, so "+ add session" may be below the fold).
- extendedWaitUntil:
    visible: "This week"
    timeout: 60000
# Settings is the line under the board, below the fold once the day is full.
- scrollUntilVisible:
    element: "Settings"
    direction: DOWN
    centerElement: true
- tapOn: "Settings"
- assertVisible: "MT class days"
- takeScreenshot: 06-settings
- scroll
- takeScreenshot: 06-settings-2
- tapOn: "‹ TODAY"
- tapOn: "library"
- assertVisible: "strength"
- takeScreenshot: 06-library
- tapOn: "strength"
- takeScreenshot: 06-library-strength
- tapOn: "Back to the Library"
- tapOn: "ledger"
- assertVisible: "WEEK"
- takeScreenshot: 06-ledger-week
- tapOn: "MONTH"
- takeScreenshot: 06-ledger-month
- tapOn: "SEASON"
- takeScreenshot: 06-ledger-season
