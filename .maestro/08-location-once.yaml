# The weather's location ask comes from iOS, once (Josh 2026-10-29: the web
# view's own ask came back on every open). Flow 01 answered it on the first
# launch; opening the app again must not ask again.
appId: com.joshbocas.app
name: Location - asked once, not on every open
---
- launchApp:
    stopApp: true
# A session an earlier flow left running on the phone opens first (BACK IN
# YOUR SESSION, or the session itself): end it or step out, then Today.
- extendedWaitUntil:
    visible: "Morning Report.*|RELOAD|END AND LOG IT|‹ TODAY"
    timeout: 60000
- tapOn:
    text: "END AND LOG IT"
    optional: true
- tapOn:
    text: "‹ TODAY"
    optional: true
- extendedWaitUntil:
    visible: "Morning Report.*|RELOAD"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: "Don.t Allow"
- takeScreenshot: 08-location-reopen
