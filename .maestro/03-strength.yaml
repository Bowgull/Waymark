appId: com.joshbocas.app
name: Strength - a dumbbell main lift's weight input
# sim-api.sh before this flow: a sore-back morning (Block Zero swaps in the
# dumbbell versions of the main lifts) and an ad-hoc strength session today.
---
- launchApp:
    stopApp: true
# Today has loaded (RELOAD pressed if it didn't). The board grows as the flows
# add sessions, so "+ add session" may be below the fold.
- runFlow: shared/open-today.yaml
- runFlow: shared/today-bottom.yaml
# the row reads its name twice (icon, flap): "STRENGTH C STRENGTH C ~40min"
- runFlow:
    file: shared/row-in-view.yaml
    env:
      ROW: "(?i)strength.*strength.*min"
- tapOn: "(?i)strength.*strength.*min"
- takeScreenshot: 03-strength-row
- runFlow: shared/today-bottom.yaml
- runFlow:
    file: shared/enter-session.yaml
    env:
      # the 3:00 skip-rope warm-up comes first now (its grass), then the sets
      READY: "LOG SET|Timer\\. Tap to (start|pause).*"
- takeScreenshot: 03-strength-warmup
# On to the first main lift: start the rope's grass and swipe it on, LOG SET each warm-up set,
# PASS the reps-left card, and swipe each rest's grass up (page 84: no NEXT SET button).
- repeat:
    while:
      notVisible: "Weight in pounds"
    times: 30
    commands:
      - tapOn:
          text: "Timer\\. Tap to start\\..*"
          optional: true
      - tapOn:
          text: "LOG SET"
          optional: true
      - tapOn:
          text: "PASS"
          optional: true
      - swipe:
          start: 50%, 92%
          end: 50%, 45%
          duration: 600
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- takeScreenshot: 03-strength-main-lift
- tapOn: "More weight"
- takeScreenshot: 03-strength-weight-up
- tapOn: "LOG SET"
- takeScreenshot: 03-strength-logged
